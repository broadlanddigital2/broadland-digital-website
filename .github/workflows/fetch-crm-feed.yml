# Manual: saves the CRM seo-feed (the pages the worker serves live) as an artifact, for building and checking page
# styles locally (tools/test/serve.mjs with CRM_FIXTURE=feed.json).
name: Fetch CRM feed
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSf "https://dipjypzrfigkzuarlsov.supabase.co/functions/v1/seo-feed?key=c9a2ffbc-820c-45d0-a212-14f0f33a2f54" -o feed.json && ls -la feed.json
      - uses: actions/upload-artifact@v4
        with: { name: crm-feed, path: feed.json, retention-days: 3 }
